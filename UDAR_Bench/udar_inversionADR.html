<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDAR Bench</title>
<style>
/* UDAR Bench -- plan: cool paper-gray workspace, ink text, one blue accent; data colours follow the validated categorical set.
   layout: top bar (name, tabs, 1D/2D switch) over a two-column workspace (controls left, plots right). */
:root {
  --bg: #f3f4f2; --surface: #fcfcfb; --surface-2: #f6f7f5; --ink: #14181c; --ink-2: #4a525a; --muted: #7d858c;
  --line: #dcdfdb; --line-2: #c9cdc8; --grid: #e6e7e2; --axis: #c3c2b7;
  --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: #e4effc; --focus: #2a78d6;
  --good: #0b7a0b; --warn: #a86a00; --bad: #c0332f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 5px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1113; --surface: #171a1d; --surface-2: #1d2125; --ink: #e9ebed; --ink-2: #b4bbc1; --muted: #8a9298;
    --line: #2a2f33; --line-2: #3a4046; --grid: #272b2e; --axis: #383835;
    --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #1a2a40; --focus: #5aa0f0;
    --good: #3fbf3f; --warn: #e0a030; --bad: #ef6b66;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1113; --surface: #171a1d; --surface-2: #1d2125; --ink: #e9ebed; --ink-2: #b4bbc1; --muted: #8a9298;
  --line: #2a2f33; --line-2: #3a4046; --grid: #272b2e; --axis: #383835;
  --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #1a2a40; --focus: #5aa0f0;
  --good: #3fbf3f; --warn: #e0a030; --bad: #ef6b66;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
.app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

/* top bar */
.top { display: flex; align-items: center; gap: 18px; padding: 0 16px; height: 48px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: .1px; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; }
.tabs { display: flex; gap: 2px; height: 100%; align-items: stretch; flex: 1; overflow-x: auto; }
.tab { border: 0; background: none; padding: 0 14px; cursor: pointer; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .badge { margin-left: 6px; font-size: 11px; color: var(--muted); }
.top-r { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lbl { color: var(--muted); font-size: 12px; }
.icon-btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--radius); width: 30px; height: 28px; cursor: pointer; display: inline-grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }

/* workspace */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(330px, 400px) minmax(0, 1fr); }
.side { overflow-y: auto; padding: 14px 14px 40px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.main { overflow-y: auto; padding: 14px 18px 40px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 900px) { .work { grid-template-columns: 1fr; overflow-y: auto; display: block; } .side, .main { overflow: visible; } .side { border-right: 0; border-bottom: 1px solid var(--line); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card > header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.card > header h3 { font-size: 13px; flex: 1; }
.card > .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
.card.collapsed > .body { display: none; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
.note { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; color: var(--ink-2); font-size: 12px; }
.note.warn { border-color: var(--warn); }

/* form controls */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 10px; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld > span { color: var(--ink-2); font-size: 12px; }
.fld > span small { color: var(--muted); font-size: 11px; margin-left: 3px; }
input[type="number"], input[type="text"], select { height: 28px; width: 100%; min-width: 0; padding: 0 7px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); }
input[type="number"] { font-variant-numeric: tabular-nums; }
input:disabled, select:disabled { opacity: .5; }
input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.chk { display: flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink-2); }
.btn { height: 30px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.sp { justify-content: space-between; }

/* editable tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 2px 4px 4px; white-space: nowrap; }
.tbl td { padding: 2px 2px; vertical-align: middle; }
.tbl td input, .tbl td select { height: 26px; padding: 0 5px; }
.tbl td.x { width: 24px; }
.tbl .rm { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 3px; }
.tbl .rm:hover { color: var(--bad); background: var(--surface-2); }
.tbl .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
table.data { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
.data th, .data td { padding: 3px 9px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.data th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 500; }
.data td:first-child, .data th:first-child { text-align: left; }
.scroll-y { max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); }

/* chips for channels */
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 6px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 12px; color: var(--ink-2); user-select: none; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip i { width: 14px; height: 0; border-top: 2px solid currentColor; display: inline-block; }
.chip:hover { background: var(--surface-2); }

/* charts */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 8px; min-width: 0; }
.panel > .ph { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.panel > .ph h3 { font-size: 13px; }
.panel > .ph .sub { color: var(--muted); font-size: 12px; }
.panel > .ph .grow { flex: 1; }
.charts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1200px) { .charts2 { grid-template-columns: 1fr; } }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .axisline { stroke: var(--axis); stroke-width: 1; }
.chart .xhair { stroke: var(--ink-2); stroke-width: 1; opacity: .55; }
.chart .sync { stroke: var(--muted); stroke-width: 1; opacity: .5; }
.chart .cur { stroke: var(--accent); stroke-width: 1.5; opacity: .85; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 2px 0 4px; }
.legend button { border: 0; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: 12px; }
.legend button[aria-pressed="false"] { opacity: .4; }
.legend svg { width: 22px; height: 8px; overflow: visible; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 6px 9px; box-shadow: 0 2px 10px rgba(0,0,0,.12); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip .tx { color: var(--muted); margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 7px; }
.tip .tr b { font-weight: 600; }
.tip .tr span.k { display: inline-block; width: 12px; border-top: 2px solid; }
.tip .tr span.n { color: var(--ink-2); }
.colorbar { height: 10px; border-radius: 2px; margin: 0 0 2px; }

.progress { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.stat { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-2); }
.stat b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line-2); color: var(--ink-2); }
.pill.good { color: var(--good); border-color: var(--good); } .pill.warn { color: var(--warn); border-color: var(--warn); } .pill.bad { color: var(--bad); border-color: var(--bad); }
.dialog-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 50; }
.dialog { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 14px; width: min(720px, 92vw); max-height: 86vh; display: flex; flex-direction: column; gap: 10px; }
.dialog textarea { width: 100%; height: 340px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px; resize: none; }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--radius); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

[hidden] { display: none !important; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 60; max-width: min(640px, 92vw); box-shadow: 0 4px 18px rgba(0,0,0,.25); }
.toast.bad { background: var(--bad); color: #fff; }
.stackcharts { display: flex; flex-direction: column; gap: 14px; }
.sel-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; }
.sel-row select { width: auto; min-width: 180px; }
.about h4 { margin: 14px 0 4px; font-size: 13px; }
.about p, .about li { color: var(--ink-2); margin: 3px 0; line-height: 1.5; }
.about ul { margin: 3px 0; padding-left: 18px; }
.dialog .scroll { overflow: auto; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); margin-left: 6px; }

/* ---- ADR inputs / Real-time inversion ---- */
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stack[hidden], .empty[hidden] { display: none; }
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--radius); padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; background: var(--surface-2); color: var(--ink-2); text-align: center; }
.drop b { color: var(--ink); font-weight: 600; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.file-ok { font-size: 12px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.pick { display: flex; flex-direction: column; gap: 3px; padding-top: 8px; border-top: 1px solid var(--line); }
.pick:first-of-type { border-top: 0; padding-top: 2px; }
.pick-h { display: flex; gap: 8px; align-items: baseline; }
.pick-t { width: 100%; }
.pick-t th.c, .pick-t td.c { text-align: center; }
.pick-t td { padding: 1px 4px; }
.pick-c { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.pick-c small { color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; min-width: 28px; text-align: left; }
.pick-c small.low { color: var(--warn); }
.strip-label { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.strip-legend { display: flex; align-items: center; gap: 8px; margin: 2px 14px 4px 58px; font-size: 11px; color: var(--ink-2); flex-wrap: wrap; }
.strip-legend i { display: inline-block; width: 140px; height: 9px; border-radius: 2px; }

</style>
</head>

      if (!(S.rt.md0 >= F.md[0] && S.rt.md0 < F.md[F.n - 1])) S.rt.md0 = F.md[0];

  },
  setFieldCursor(md) { this.S.fieldMd = md; this.persist(); if (AdrView.built) AdrView.cursor(); if (RtView.built) RtView.cursor(); },
  fieldCursorIndex() {
    const F = this.field, x = this.S.fieldMd; if (!F || x === null || x === undefined) return -1;
    let lo = 0, hi = F.n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (F.md[m] <= x) lo = m; else hi = m; } return Math.abs(F.md[lo] - x) <= Math.abs(F.md[hi] - x) ? lo : hi;
  },
  rtKeyNow() {
    const F = this.field, S = this.S; if (!F) return '';

  },
  rtStatus() { if (this.busy === 'rt') return 'busy'; if (!this.rt) return 'none'; if (this.rt.key !== this.rtKeyNow() || this.rt.done < this.rt.st.length) return 'stale'; return 'ok'; },
  async runRT() {
    if (this.busy) return; const F = this.field, S = this.S;
    if (!F) { this.toast('Load a DLIS file in the ADR inputs tab first.', 'bad'); return; }
    const chans = FIELD.resolve(F, S.adr.sel || [], S.adr.useCorr);
    if (!chans.length) { this.toast('Pick at least one channel in the ADR inputs tab.', 'bad'); return; }
    if (!(S.rt.md1 > S.rt.md0)) { this.toast('The interval is empty. Check From MD and To MD.', 'bad'); return; }
    if (!(S.rt.step >= F.spacing - 1e-9)) { this.toast('Invert every ' + fsig(F.spacing, 2) + ' ' + F.unit + ' or more.', 'bad'); return; }
    const set = FIELD.settings(S, F), off = []; let o = 0; for (const c of chans) { off.push(o); o += c.n; }

  confirmReset() {

  showAbout() {
    const close = () => back.remove();
    const li = (...t) => h('li', null, ...t);
    const body = h('div', { class: 'about scroll' },
      h('p', null, 'UDAR Bench generates synthetic ultra-deep azimuthal resistivity (UDAR) logs for a tool and a well that you define, and inverts them station by station with a layered 1D model.'),
      h('h4', null, 'Forward model'),
      h('ul', null,
        li('Transmitters and receivers are point magnetic dipoles on a rigid, straight tool whose axis follows the well. Each channel couples one transmitter axis to one receiver axis at one spacing and one frequency.'),
        li('Couplings are normalised by the free-space coaxial coupling at the same spacing, so a ZZ coupling in a vacuum is 1 (0 dB, 0°). The convention is e^(−iωt); z points down.'),
        li('Layers are transversely isotropic (horizontal resistivity Rh along bedding, vertical resistivity Rv across it), planar, and non-magnetic. The solution is quasi-static: displacement currents are ignored.'),
        li('The borehole, tool mandrel and tool body are not modelled. The signals are those of an idealised dipole tool in the formation.'),
        li('1D mode is a semi-analytic layered-earth solution (generalised reflection coefficients and a digital Hankel transform with Key 2012 filters) for planar layers with one constant dip. It was checked against the empymod package.'),
        li('Toolface is measured from the high side of the hole, increasing clockwise when looking down-hole.')),
      h('h4', null, '2D mode'),
      h('ul', null,
        li('The geology is a vertical section: boundaries are polylines and Rh, Rv vary along the section. It does not change perpendicular to the section, and the well must lie in the section plane, so azimuths snap to the section azimuth or its opposite.'),
        li('The 2.5D finite-difference solver gives the full response of that section. Every station first gets the exact layered-earth response of a local-1D model (the boundaries below the tool, with the dip of the nearest boundary). The solver then computes what that local model leaves out, faults, pinch-outs, lateral resistivity changes and boundary curvature, as the difference between two finite-difference solutions, one for the true section and one for the local model, on the same grid.'),
        li('The solver works in the frequency domain with a Fourier transform along strike, a staggered grid in the section that is refined around the tool and stretched outward, edge-based (laminate) averaging of the conductivity across boundaries, and a sparse direct solver. Taking the difference of two solutions on the same grid cancels most of the discretisation error close to the antennas.'),
        li('The correction is solved at selected stations, every 25 m by default, at both sides of every jump of the local model, and where it changes quickly. It is interpolated along the well in between. Stations with no 2D feature within reach are skipped.'),
        li('Accuracy at the Standard setting was checked against exact solutions for a vertical resistivity contrast in 23 cases: 5 to 40 m spacings, 1 to 100 kHz, 2 to 50 Ω·m on the tool side against 0.2 to 1000 Ω·m across the contrast, 1 to 20 m away or straddled by the antennas, with the tool parallel, oblique or perpendicular to it. The error of the correction was 0.2–2.5% of its peak value. Along the well the correction scatters by about 0.001 of the free-space coupling from station to station. Compared with solving every station, interpolation between solver stations added at most 0.004 next to a 6 m fault and 0.0002 across a lateral resistivity change. For small corrections, such as a dip that changes by a few degrees, the error is about 0.001 of the free-space coupling, roughly 0.01 dB. That can still be 10–20% of a small correction. Accuracy drops when a 2D feature is within a few grid cells of the antennas; the 2.5D solver table flags these stations.'),
        li('The local-1D approximation computes only the first step. It is instant but leaves out everything listed above, and it is least reliable close to faults, pinch-outs and lateral contrasts.')),
      h('h4', null, 'ADR field data (ADR inputs and Real-time inversion tabs)'),
      h('ul', null,
        li('These tabs read the public Ekofisk release of Halliburton ADR data: Loss and ConocoPhillips (2026), ten horizontal wellbores in eleven DLIS files, Zenodo, doi:10.5281/zenodo.24133398. The ADR channels are released under the Norwegian Licence for Open Government Data (NLOD) 2.0; the record says the terms of the DISKOS logs and well paths in the same files still have to be confirmed before redistribution. The files are read in your browser and are not stored.'),
        li('The tool model has six coaxial transmitters at ±16, ±32 and ±48 in and three receivers tilted 45°: R1 and R2 at ±4 in and R3 at +64 in, after Halliburton patent US 7,659,722; the patent does not name the ADR. Frequencies are 2 MHz, 500 kHz and 125 kHz.'),
        li('Averaged and image resistivities at 16, 32 and 48 in are the compensated R1/R2 phase difference and attenuation of the two transmitters at ±s, converted with homogeneous-medium tables from the same model. The 50, 66 and 82 in long-spacing channels are taken as R1 and R3 with the transmitters at −16, −32 and −48 in, because those are the distances to the R1–R3 midpoint; this is an inference from the channel names. Geosignals are R3 with each transmitter: the phase or attenuation in each bin minus the average over the bins, which matches the delivered geosignals, whose bins average to zero.'),
        li('Not published, and assumed here: R1 and R2 are tilted as mirror images, because with the same tilt the compensated images would show no azimuthal variation at all; bin 1 is centred 5.6° clockwise from the high side, looking downhole, which puts the delivered top, right, bottom and left quadrants on bins 29–4, 5–12, 13–20 and 21–28 as the data show; images read lower toward a more conductive bed. With these choices the delivered geosignal phase and attenuation have the signs the model predicts on three wells. A kinematic check favours this orientation: on well 2/4-Z-31 Y1 the inverted distance to the boundary above grows, and to the boundary below shrinks, as the well deepens (slopes +0.26 and −0.49 against TVD, where flat beds would give +1 and −1); with bin 1 at the low side neither trend appears. On well 2/4-Z-25 the same check was inconclusive. Treat the orientation as likely, not confirmed.'),

        li('Each station is inverted on its own with planar layers: a tool layer with a boundary above and below (or one boundary, or none), bounded Levenberg–Marquardt on ln R and distances, 128 screened starting models refined from the best six, and a warm start from the previous station. On synthetic ADR data it recovered three test models, including a boundary 2.5 m away at 2.39 ± 0.08 m.')),

        li('Each station is inverted independently with a bounded Levenberg–Marquardt solver. The unknowns are Rh and Rv/Rh of each layer, the distance to the first boundary and the thickness of interior layers, measured along the bedding normal. The dip is taken as given, plus any error you add.'),
        li('Residuals are weighted by the noise you assume. The ±1σ values come from the linearised (Gauss–Newton) covariance at the solution. They are not a full posterior.'),
