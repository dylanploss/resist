<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <!-- Scale: x = 70 + (inches from tool centre + 112) * 5 px. Uphole is left. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d95f02"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="940" height="400" fill="#fff"/>

  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold">ADR antenna layout assumed by the forward model (adr_forward.py)</text>
  <text x="470" y="42" text-anchor="middle" fill="#d95f02">Orange = GUESSED long-spacing geometry for ZR{M,L}{50,66,82}: not vendor-confirmed, uncompensated, weight 0.5</text>

  <line x1="200" y1="62" x2="60" y2="62" stroke="#555" marker-end="url(#arrg)"/>
  <text x="206" y="66" fill="#555">uphole</text>
  <line x1="740" y1="62" x2="880" y2="62" stroke="#555" marker-end="url(#arrg)"/>
  <text x="734" y="66" text-anchor="end" fill="#555">downhole (bit)</text>

  <!-- Guessed long-spacing paths: uphole Tx to Rls -->
  <g fill="none" stroke="#d95f02" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)">
    <path d="M550,140 Q675,100 798,140"/>
    <path d="M470,140 Q635,70 798,140"/>
    <path d="M390,140 Q595,40 798,140"/>
  </g>
  <g fill="#d95f02" font-weight="bold" text-anchor="end">
    <text x="544" y="138">50 in</text>
    <text x="464" y="138">66 in</text>
    <text x="384" y="138">82 in</text>
  </g>

  <!-- Mandrel -->
  <rect x="40" y="152" width="870" height="16" rx="4" fill="#e6e6e6" stroke="#999"/>

  <!-- Transmitters (axial coils) -->
  <g fill="#fff" stroke-width="2.5">
    <ellipse cx="70" cy="160" rx="4" ry="16" stroke="#7570b3"/>
    <ellipse cx="390" cy="160" rx="4" ry="16" stroke="#1f77b4"/>
    <ellipse cx="470" cy="160" rx="4" ry="16" stroke="#1f77b4"/>
    <ellipse cx="550" cy="160" rx="4" ry="16" stroke="#1f77b4"/>
    <ellipse cx="710" cy="160" rx="4" ry="16" stroke="#1f77b4"/>
    <ellipse cx="790" cy="160" rx="4" ry="16" stroke="#1f77b4"/>
    <ellipse cx="870" cy="160" rx="4" ry="16" stroke="#1f77b4"/>
  </g>

  <!-- Tilted receivers (45 deg) -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="602" y1="176" x2="618" y2="144" stroke="#1f77b4"/>
    <line x1="622" y1="176" x2="638" y2="144" stroke="#7570b3"/>
    <line x1="642" y1="176" x2="658" y2="144" stroke="#1f77b4"/>
    <line x1="792" y1="176" x2="808" y2="144" stroke="#d95f02" stroke-dasharray="4,2"/>
  </g>
  <circle cx="800" cy="160" r="15" fill="none" stroke="#d95f02" stroke-dasharray="3,2"/>
  <text x="818" y="132" fill="#d95f02" font-weight="bold">Rls ? (+34 in)</text>

  <!-- Position and name labels -->
  <g text-anchor="middle" fill="#333" font-size="11">
    <text x="70" y="196">-112</text><text x="390" y="196">-48</text><text x="470" y="196">-32</text>
    <text x="550" y="196">-16</text><text x="610" y="196">-4</text><text x="630" y="196">0</text>
    <text x="650" y="196">+4</text><text x="710" y="196">+16</text><text x="790" y="196">+32</text>
    <text x="870" y="196">+48</text>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="70" y="212" fill="#7570b3">T112</text>
    <text x="390" y="212" fill="#1f77b4">T48</text><text x="470" y="212" fill="#1f77b4">T32</text>
    <text x="550" y="212" fill="#1f77b4">T16</text>
    <text x="608" y="212" fill="#1f77b4">R1</text><text x="630" y="212" fill="#7570b3">Rg</text>
    <text x="652" y="212" fill="#1f77b4">R2</text>
    <text x="710" y="212" fill="#1f77b4">T16'</text><text x="790" y="212" fill="#1f77b4">T32'</text>
    <text x="870" y="212" fill="#1f77b4">T48'</text>
  </g>
  <text x="40" y="196" text-anchor="end" fill="#333" font-size="11">in</text>

  <!-- Measurement brackets -->
  <g fill="none" stroke-width="1.5">
    <path d="M610,226 v6 h40 v-6" stroke="#1f77b4"/>
    <path d="M650,248 v6 h150 v-6" stroke="#d95f02"/>
  </g>
  <text x="630" y="246" text-anchor="middle" fill="#1f77b4" font-size="11">8 in</text>
  <text x="725" y="268" text-anchor="middle" fill="#d95f02" font-size="11">V(R2) / V(Rls), same look bin, 30 in baseline</text>

  <!-- Legend -->
  <g font-size="12">
    <rect x="40" y="290" width="12" height="12" fill="#1f77b4"/>
    <text x="60" y="300">AR / ZR 16, 32, 48 in: T(up) and mirrored T'(down) into R1/R2, averaged = compensated (tool and borehole errors cancel)</text>
    <rect x="40" y="312" width="12" height="12" fill="#7570b3"/>
    <text x="60" y="322">ZG 112 in: T112 into centre receiver Rg, top vs bottom bin (geosignal)</text>
    <rect x="40" y="334" width="12" height="12" fill="#d95f02"/>
    <text x="60" y="344">ZR 50, 66, 82 in: uphole T16/T32/T48 into Rls 34 in downhole (GUESS: 16/32/48 + 34); no mirror Tx, so uncompensated</text>
    <text x="40" y="372" fill="#555">Transmitters: axial coils. Receivers: tilted 45 deg. Positions in inches from the tool centre; x is to scale.</text>
    <text x="40" y="390" fill="#555">Boundaries seen only by ZR 50/66/82 depend on this guess. High 50/66/82 misfit with a good 16/32/48 fit points at the geometry.</text>
  </g>
</svg>
